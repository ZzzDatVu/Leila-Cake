<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán - Leila Cake</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fff5f8; padding: 20px; }
        .form-box { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .radio-group { display: flex; gap: 20px; margin-bottom: 15px; background: #fff0f5; padding: 10px; border-radius: 6px; }
        .btn-submit { background: #ff4d94; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: #e6005c; }

        .hidden-box { display: none; }

        .total-box { display: flex; justify-content: space-between; align-items: center; background: #fff8fa; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px dashed #ff4d94; }
        .total-price { color: #e6005c; font-size: 20px; font-weight: bold; }
        .ship-note { font-size: 11px; color: #888; font-weight: normal; display: block; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>📋 Thông Tin Đặt Bánh</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Họ và Tên khách hàng *</label>
                <input type="text" name="customer_name" required placeholder="Ví dụ: Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label>Số điện thoại *</label>
                <input type="text" name="customer_phone" required placeholder="08344201xx">
            </div>

            <label>Hình thức nhận hàng *</label>
            <div class="radio-group">
                <label><input type="radio" name="fulfillment_type" value="pickup" id="radioPickup" checked onclick="toggleFulfillment()"> 🏃‍♂️ Tự đến lấy</label>
                <label><input type="radio" name="fulfillment_type" value="ship" id="radioShip" onclick="toggleFulfillment()"> 🛵 Giao tận nơi (Ship)</label>
            </div>

            <!-- Khung giờ lấy bánh (Chỉ hiện khi Tự đến lấy) -->
            <div class="form-group" id="pickupBox">
                <label>Khung giờ ghé lấy bánh tại quán:</label>
                <input type="text" name="pickup_time" id="pickupTimeInput" placeholder="Ví dụ: 15h30 chiều nay">
            </div>

            <!-- Địa chỉ ship (Chỉ hiện khi Giao tận nơi) -->
            <div class="form-group hidden-box" id="shipBox">
                <label>Địa chỉ giao hàng tận nơi:</label>
                <textarea name="shipping_address" id="shippingAddress" rows="2" placeholder="Nhập số nhà, tên đường, quận (Lưu ý: Tiệm ở Tân Phú)..."></textarea>
                <p style="color: #e6005c; font-size: 12px; margin-top: 5px;">
                    ⚠️ Do ở xa gần khác nhau, tiệm sẽ nhắn Zalo trao đổi cụ thể về phí ship sau khi nhận đơn!
                </p>
            </div>

            <div class="form-group">
                <label>Ghi chú (Ghi chữ lên bánh / Yêu cầu khác)</label>
                <textarea name="note" rows="2" placeholder="Ví dụ: Viết chữ 'Happy Birthday An' lên bánh kem"></textarea>
            </div>

            <!-- Khung tổng tiền có thay đổi linh hoạt theo hình thức nhận -->
            <div class="total-box">
                <div>
                    <span id="totalLabel">Tổng tiền bánh (Thanh toán tại quán):</span>
                    <span class="ship-note" id="shipNoteText">Đã bao gồm tiền bánh, chưa tính phí ship</span>
                </div>
                <span class="total-price">{{ total_price }} đ</span>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Hoàn Tất & Gửi Đơn ➔</button>
        </form>
    </div>

    <script>
        function toggleFulfillment() {
            const isPickup = document.getElementById('radioPickup').checked;
            const shipBox = document.getElementById('shipBox');
            const pickupBox = document.getElementById('pickupBox');
            const addressInput = document.getElementById('shippingAddress');
            const pickupTimeInput = document.getElementById('pickupTimeInput');

            const totalLabel = document.getElementById('totalLabel');
            const shipNoteText = document.getElementById('shipNoteText');

            if (isPickup) {
                // Tự đến lấy
                pickupBox.classList.remove('hidden-box');
                pickupTimeInput.required = true;

                shipBox.classList.add('hidden-box');
                addressInput.required = false;

                // Đổi chữ giải thích cho phần đến lấy
                totalLabel.innerText = "Tổng tiền thanh toán:";
                shipNoteText.innerText = "Thanh toán khi nhận bánh tại 136 Thoại Ngọc Hầu";
            } else {
                // Giao tận nơi (Ship)
                pickupBox.classList.add('hidden-box');
                pickupTimeInput.required = false;

                shipBox.classList.remove('hidden-box');
                addressInput.required = true;

                // Đổi chữ giải thích cho phần ship để khách biết chưa tính ship
                totalLabel.innerText = "Tiền bánh tạm tính:";
                shipNoteText.innerText = "Chưa bao gồm phí ship (Tiệm sẽ báo qua Zalo)";
            }
        }
        toggleFulfillment();
    </script>
</body>
</html>
